<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Hermetic font resolution for the Linux visual-parity goldens
  (e2e/goldens/linux). playwright.config.ts points the browser's
  FONTCONFIG_FILE here on Linux only, so the host's font packages and
  /etc/fonts rules cannot change which glyphs the app's system font stack
  renders. Only Liberation (fonts-liberation, a google-chrome-stable
  dependency present on GitHub's ubuntu runners and in the Playwright image)
  is visible, and every generic family resolves to it.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>

  <!-- Every family in the app's sans and mono stacks, plus the generics. -->
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>-apple-system</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Roboto</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Helvetica</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>ui-monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>SFMono-Regular</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Menlo</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Consolas</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>mono</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <!-- Any other family falls back to sans, not the first font on disk. -->
  <match target="pattern">
    <edit name="family" mode="append_last"><string>Liberation Sans</string></edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
