<svg xmlns="http://www.w3.org/2000/svg" class="bf" viewBox="0 0 686 256" role="img" aria-labelledby="title desc">
<title id="title">Beamfall</title><desc id="desc">Cut Beam lockup intro: falling light builds the mark while a ray from the B writes the wordmark. Ends on the static lockup.</desc>
<style>
/* Beamfall Cut Beam intro, generated by build.py. Effect layers are invisible in their
   static style and the master layers are hidden only while an animation runs, so the
   last frame, reduced motion and non-CSS renderers all show the approved logo exactly.
   Recolour (inline SVG): set --bf-logo-color on the svg element or an ancestor, or set
   the four gradient stops directly with --bf-logo-s0 to --bf-logo-s3. When neither is
   set, the brand gradient is used. --bf-wordmark-color sets the lettering colour.
   --bf-intro-speed scales the timing (2 = half speed). Timings below are written at twice
   the default duration, which the owner halved after review (.5 in --bf-d). */
.bf{--_t0:color-mix(in oklab,var(--bf-logo-color) 42%,white);--_t1:color-mix(in oklab,var(--bf-logo-color) 92%,white);--_t2:color-mix(in oklab,var(--bf-logo-color) 88%,black);--_t3:color-mix(in oklab,var(--bf-logo-color) 58%,#06202c);--_tr:color-mix(in oklab,var(--bf-logo-color) 40%,black);--bf-d:calc(var(--bf-intro-speed,1)*.5);--_glow:var(--bf-logo-s1,var(--_t1,#55dce7))}
.s0{stop-color:var(--bf-logo-s0,var(--_t0,#b1f4f7))}.s1{stop-color:var(--bf-logo-s1,var(--_t1,#55dce7))}
.s2{stop-color:var(--bf-logo-s2,var(--_t2,#37c9dd))}.s3{stop-color:var(--bf-logo-s3,var(--_t3,#248ea9))}
.r2{stop-color:var(--_tr,#094e6c)}.gl{stop-color:var(--_glow)}
.fx{opacity:0}.glow{fill:var(--_glow)}
/* the master body is hidden while light builds a masked copy of it */
.body{animation:bf-hold calc(2.1s*var(--bf-d)) linear 0s backwards}
.build{opacity:0;animation:bf-show calc(2.15s*var(--bf-d)) linear 0s backwards,bf-cool calc(1.5s*var(--bf-d)) ease-out calc(.25s*var(--bf-d)) backwards}
/* each slice of the mask grows down exactly as fast as its beam falls */
.col,.drop{transform-box:view-box;animation-duration:calc(var(--t)*var(--bf-d));animation-delay:calc(var(--d)*var(--bf-d));animation-timing-function:cubic-bezier(.5,0,.8,.3);animation-fill-mode:both}
.col{transform-origin:0 0;animation-name:bf-grow}
.drop{animation-name:bf-drop}
.beam{animation:bf-out calc(.45s*var(--bf-d)) ease-out calc((var(--d) + var(--t))*var(--bf-d)) backwards}
.flare{transform-box:fill-box;transform-origin:center;animation:bf-flare calc(.8s*var(--bf-d)) cubic-bezier(.1,.8,.3,1) calc(1.15s*var(--bf-d)) none}
.streak{animation:bf-streak calc(.65s*var(--bf-d)) cubic-bezier(.4,0,.6,1) calc(1.45s*var(--bf-d)) none}
.edge{animation:bf-cut calc(.55s*var(--bf-d)) cubic-bezier(.3,0,.2,1) calc(1.8s*var(--bf-d)) backwards}
.rim{animation:bf-fade calc(.6s*var(--bf-d)) ease-out calc(1.9s*var(--bf-d)) backwards}
@keyframes bf-hold{0%,100%{opacity:0}}
@keyframes bf-show{0%,100%{opacity:1}}
@keyframes bf-cool{0%{filter:brightness(1.6) saturate(.8)}}
@keyframes bf-grow{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
@keyframes bf-drop{0%{transform:translateY(0)}100%{transform:translateY(600px)}}
@keyframes bf-out{0%{opacity:1}100%{opacity:0}}
@keyframes bf-flare{0%{opacity:.6;transform:scale(.15,.6)}100%{opacity:0;transform:scale(1.6,1)}}
@keyframes bf-streak{0%{opacity:1;stroke-dashoffset:.22}80%{opacity:1}100%{opacity:0;stroke-dashoffset:-1}}
@keyframes bf-cut{0%{stroke-dasharray:1 1;stroke-dashoffset:1}100%{stroke-dasharray:1 1;stroke-dashoffset:0}}
@keyframes bf-fade{0%{opacity:0}}
.streak{animation-name:bf-vis;animation-timing-function:ease-in}.sk{animation:bf-dash calc(.65s*var(--bf-d)) cubic-bezier(.3,0,.3,1) calc(1.45s*var(--bf-d)) both}
@keyframes bf-vis{0%,35%{opacity:1}100%{opacity:0}}
@keyframes bf-dash{0%{stroke-dashoffset:.22}100%{stroke-dashoffset:-.7}}
.wm path,.wmb path{fill:var(--bf-wordmark-color,#e9f2f6)}
.wm{animation:bf-hold calc(2s*var(--bf-d)) linear 0s backwards}
.wmb{opacity:0;animation:bf-show calc(2.05s*var(--bf-d)) linear 0s backwards}
.wmb>g{animation:bf-flash calc(.5s*var(--bf-d)) ease-out calc(var(--a)*var(--bf-d)) backwards}
@keyframes bf-flash{0%{filter:brightness(1.7) drop-shadow(0 0 4px var(--_glow))}}
.ray{animation:bf-rayvis calc(1.4s*var(--bf-d)) linear calc(1s*var(--bf-d)) none}
@keyframes bf-rayvis{0%,62%{opacity:1}100%{opacity:0}}
.wcol,.rayline,.rayhead{transform-box:view-box;transform-origin:166px 0;animation-duration:calc(0.9s*var(--bf-d));animation-delay:calc(1s*var(--bf-d));animation-timing-function:linear;animation-fill-mode:both}
.wcol,.rayline{animation-name:bf-grow-x}.rayhead{animation-name:bf-travel}
@keyframes bf-grow-x{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes bf-travel{0%{transform:translateX(0)}100%{transform:translateX(490px)}}
.bf-paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.bf *{animation:none!important}}
</style>
<defs>
