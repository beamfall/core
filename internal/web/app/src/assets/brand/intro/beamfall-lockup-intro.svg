<linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#efffff" stop-opacity=".58"/><stop offset=".55" stop-color="#d2faff" stop-opacity=".1"/><stop class="r2" offset="1" stop-color="#094e6c" stop-opacity=".3"/></linearGradient>
<linearGradient id="edge" x1="188" y1="130" x2="312" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#f1ffff"/><stop offset=".62" stop-color="#d6ffff" stop-opacity=".75"/><stop offset="1" stop-color="#d6ffff" stop-opacity="0"/></linearGradient>
<linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop class="gl" stop-opacity="0"/><stop class="gl" offset=".6" stop-opacity=".35"/><stop class="gl" offset=".95" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".8"/></linearGradient>
<linearGradient id="ray" x1="0" y1="0" x2="1" y2="0"><stop class="gl" stop-opacity=".15"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="glow" filterUnits="userSpaceOnUse" x="-200" y="-800" width="1400" height="1700"><feGaussianBlur stdDeviation="10"/></filter>
<filter id="soft" filterUnits="userSpaceOnUse" x="-200" y="-200" width="1400" height="900"><feGaussianBlur stdDeviation="5"/></filter>
<linearGradient id="fadetop" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff"/><stop offset=".86" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="beamfade" maskUnits="userSpaceOnUse" x="-20" y="-20" width="552" height="552"><rect x="-20" y="-20" width="552" height="552" fill="url(#fadetop)"/></mask>
<mask id="reveal" maskUnits="userSpaceOnUse" x="-20" y="-20" width="552" height="552"><g filter="url(#soft)">
<rect class="col" style="--d:0.15s;--t:1.1s" x="0" y="0" width="189" height="600" fill="#fff"/>
<rect class="col" style="--d:0.5s;--t:0.9s" x="188" y="0" width="59" height="600" fill="#fff"/>
<rect class="col" style="--d:0.62s;--t:0.9s" x="246" y="0" width="59" height="600" fill="#fff"/>
<rect class="col" style="--d:0.74s;--t:0.9s" x="304" y="0" width="55" height="600" fill="#fff"/>
<rect class="col" style="--d:0.86s;--t:0.9s" x="358" y="0" width="154" height="600" fill="#fff"/>
</g></mask>
