# Hosted checks: INFORMATIONAL ONLY. Hosted GitHub Actions is not a merge gate
# (operator decision 2026-07-22); the blocking signal is the local `make gate`
# on the exact head. A hosted runner has no sibling workspace, Corvint,
# OpenSpec, Swift or the gate's container images, so it runs only the subset
# of gate steps it can satisfy, instead of a `make gate` that cannot pass here.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  GATE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: internal/web/app/package-lock.json
      - name: check trust documents
        run: sh .github/check-trust-docs.sh
      - name: install govulncheck and golangci-lint
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: release workflow pins
        run: make release-workflow-pins-check
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: vuln-check
        run: make vuln-check
      - name: golangci-lint (staticcheck + gosec)
        run: make lint

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: resolve race diff scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base=""
          head="$(git rev-parse --verify HEAD 2>/dev/null || printf '%s' "${HEAD_SHA:-HEAD}")"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -n "$PR_BASE" ] && git merge-base --is-ancestor "$PR_BASE" "$head" 2>/dev/null; then
              base="$PR_BASE"
            elif [ -n "$PR_BASE" ]; then
              base="$(git merge-base "$PR_BASE" "$head" 2>/dev/null || true)"
            fi
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
            if [ -n "$HEAD_SHA" ]; then
              head="$HEAD_SHA"
            fi
          fi
          {
            echo "GATE_DIFF_BASE=$base"
            echo "GATE_DIFF_HEAD=$head"
          } >> "$GITHUB_ENV"
      - name: make gate-race
        env:
          RACE_SHORT_ORDINARY_TIMEOUT: "1800s"
          RACE_SHORT_ORDINARY_P: "2"
        run: make gate-race

  gate-aggregate:
    runs-on: ubuntu-latest
    needs:
      - gate
      - race
    steps:
      - run: 'echo "gate: PASS"'
