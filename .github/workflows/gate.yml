# Merge gate CI. Local `make gate` is the serial reproducer for non-race checks;
# race remains merge-blocking here as its own lane.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  GATE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: internal/web/app/package-lock.json
      - name: check trust documents
        run: sh .github/check-trust-docs.sh
      # make gate runs vuln-check (govulncheck) and the FFmpeg unit tests, which
      # refuse to skip when ffmpeg is missing. The runner's own ffmpeg is enough
      # for those; the pinned jellyfin build is checked by the gate's
      # ffmpeg-tonemap-conforming step in a debian:bookworm container.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: make gate
        run: make gate

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: make gate-race
        run: make gate-race

  gate-aggregate:
    runs-on: ubuntu-latest
    needs:
      - gate
      - race
    steps:
      - run: 'echo "gate: PASS"'
