# Hosted checks: INFORMATIONAL ONLY. Hosted GitHub Actions is not a merge gate
# (operator decision 2026-07-22); the blocking signal is the local `make gate`
# on the exact head. A hosted runner has no sibling workspace, Corvint,
# OpenSpec, Swift or the gate's container images, so it runs only the subset
# of gate steps it can satisfy, instead of a `make gate` that cannot pass here.
name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GATE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  GATE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: internal/web/app/package-lock.json
      - name: check trust documents
        run: sh .github/check-trust-docs.sh
      - name: install govulncheck and golangci-lint
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: release workflow pins
        run: make release-workflow-pins-check
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: vuln-check
        run: make vuln-check
      - name: golangci-lint (staticcheck + gosec)
        run: make lint

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: make gate-race
        run: make gate-race

  gate-aggregate:
    runs-on: ubuntu-latest
    needs:
      - gate
      - race
    steps:
      - run: 'echo "gate: PASS"'
