# Nightly UI catalog pixel diff. This is intentionally outside the push/PR gate:
# Playwright browser setup is too expensive for every autonomous merge, but the
# visual contract still needs a regular signal.
#
# Least-privilege layout (SECAUDIT-20260817-UI-NIGHTLY-LEAST-PRIVILEGE-1):
# checkout, dependency install, browser execution, and artifact upload run with
# contents: read and persist-credentials: false. Only the isolated
# file-red-ticket job holds contents: write; it consumes nothing from the
# browser job beyond the inert aggregate result string, checks out trusted
# default-branch code, and is reachable only from scheduled runs or a
# workflow_dispatch on the default branch — never an arbitrary dispatch ref.
# Enforced by `script/nightly-freshness.sh workflow-policy`, which the gate
# runs via script/nightly-freshness_test.sh.
name: ui-catalog-nightly

on:
  schedule:
    - cron: "37 6 * * *" # Daily 06:37 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/ui-catalog/package-lock.json
      - name: install Playwright Chromium
        working-directory: tools/ui-catalog
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: UI catalog pixel diff
        run: make ui-catalog
      - name: Record last green
        if: success()
        run: script/nightly-freshness.sh record --tier ui-catalog-nightly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: nightly-last-green-ui-catalog-nightly
          path: .agent-evidence/nightly-last-green/ui-catalog-nightly.json

  file-red-ticket:
    needs: ui-catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && needs.ui-catalog.result == 'failure' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Record red contract triage note
        run: script/nightly-freshness.sh red-contract --tier ui-catalog-nightly --repo beamfall
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-last-green-ui-catalog-nightly
          path: .agent-evidence/nightly-last-green/ui-catalog-nightly.json
