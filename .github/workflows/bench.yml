# Weekly entity-query latency benchmark (`make bench`): the ADR-0011 §2
# synthetic 100k-Media fixture + P95 budget suite. Budget regressions fail
# this job; the nightly release-gate also runs the same bench.
name: bench

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make bench
        run: |
          make bench 2>&1 | tee bench.out
          {
            echo "## Entity-query benchmark (make bench)"
            echo
            echo '```'
            cat bench.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
