name: clean-checkout-canary

on:
  schedule:
    - cron: "07 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-checkout-canary:
    # CORE-1112: Playwright has no Chromium for ubuntu26.04, which ubuntu-latest now resolves to,
    # so jobs that install it pin the newest image Playwright supports.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          path: beamfall
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: beamfall/go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install gate tools
        # make gate runs vuln-check, lint and ffmpeg-backed tests; versions match gate.yml.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Clean-checkout canary
        working-directory: beamfall
        env:
          BEAMFALL_WORKSPACE: ${{ github.workspace }}
        run: script/clean-checkout-canary.sh --repo beamfall

  alert-on-failure:
    if: ${{ always() && github.event_name == 'schedule' && needs.clean-checkout-canary.result == 'failure' }}
    needs: clean-checkout-canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open failure alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Clean-checkout canary nightly failure"
          existing="$(gh issue list --state open --search "$title in:title" --json title --jq "map(select(.title == \"$title\")) | length")"
          if [ "$existing" -eq 0 ]; then
            gh issue create \
              --title "$title" \
              --body "The scheduled clean-checkout canary failed. Inspect the run and restore a green detached Core build: $RUN_URL"
          else
            echo "An open clean-checkout canary alert already exists. Failed run: $RUN_URL"
          fi
