# Nightly full race detector pass (ADR-0121 §3, TEST-CORE-1). The push/PR gate
# runs only the fast `-race -short` subset (excludes internal/graph + internal/store,
# which time out under -race ~606s); this job runs the full `go test -race ./...`
# over everything, with a raised per-package timeout and capped parallelism.
#
# The race detector requires CGO_ENABLED=1 and a C toolchain; ubuntu-latest ships
# gcc, and script/race-test.sh fail-loud-checks for it. Intentionally outside the
# push/PR gate: a full race pass is too slow for every autonomous merge.
name: race-nightly

on:
  schedule:
    - cron: "23 5 * * *" # Daily 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: full -race ./...
        run: make race-full
      - name: Record last green
        if: success()
        run: script/nightly-freshness.sh record --tier race-nightly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: nightly-last-green-race-nightly
          path: .agent-evidence/nightly-last-green/race-nightly.json
