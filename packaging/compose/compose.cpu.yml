services:
  beamfall:
    image: ${BEAMFALL_IMAGE:?immutable-digest-reference-required}
    container_name: beamfall
    restart: unless-stopped
    ports:
      - "${BEAMFALL_HTTP_BIND:-127.0.0.1}:${BEAMFALL_HTTP_PORT:-8800}:8800"
    environment:
      BEAMFALL_ADDR: "0.0.0.0:8800"
      BEAMFALL_DATA_DIR: "/data"
      BEAMFALL_TRANSCODE_CAP: "${BEAMFALL_TRANSCODE_CAP:-2}"
    volumes:
      - beamfall-data:/data
      - ${BEAMFALL_MEDIA_DIR:-/srv/media}:/media:ro
      - beamfall-transcode:/transcode

volumes:
  beamfall-data:
  beamfall-transcode:
