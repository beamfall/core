services:
  # The reverse proxy relays every Internet client to `beamfall`, so requestIsLAN
  # (internal/server/server.go) and the pairing LAN gate must be able to tell a
  # relayed request apart from one that truly originated on this bridge network.
  # Pinning the subnet below and declaring it on `beamfall` is what makes that
  # possible: without a fixed, known CIDR to declare in BEAMFALL_KNOWN_PROXIES,
  # every client of this proxy would read as LAN (BUGREV0925-CORE-LAN-PROXY-1).
  beamfall:
    networks:
      beamfall-proxy-net:
    environment:
      BEAMFALL_KNOWN_PROXIES: "${BEAMFALL_KNOWN_PROXIES:-172.28.90.0/24}"

  beamfall-proxy:
    image: caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    profiles: ["public-bind"]
    restart: unless-stopped
    depends_on:
      - beamfall
    networks:
      beamfall-proxy-net:
    ports:
      - "${BEAMFALL_PUBLIC_HTTP_BIND:-0.0.0.0}:${BEAMFALL_PUBLIC_HTTP_PORT:-80}:80"
      - "${BEAMFALL_PUBLIC_HTTPS_BIND:-0.0.0.0}:${BEAMFALL_PUBLIC_HTTPS_PORT:-443}:443"
    environment:
      BEAMFALL_PUBLIC_HOST: "${BEAMFALL_PUBLIC_HOST:?set BEAMFALL_PUBLIC_HOST to the HTTPS hostname}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - beamfall-caddy-data:/data
      - beamfall-caddy-config:/config

networks:
  # Fixed bridge subnet so BEAMFALL_KNOWN_PROXIES above names a CIDR that is
  # stable across recreates, instead of Compose's per-project auto-assigned
  # default network subnet.
  beamfall-proxy-net:
    ipam:
      config:
        - subnet: 172.28.90.0/24

volumes:
  beamfall-caddy-data:
  beamfall-caddy-config:
