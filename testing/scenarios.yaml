# Beamfall scenario registry
#
# The journey axis beside:
#   - testing/features.yaml  (functionality breadth via feature:<id>)
#   - testing/io-ops.yaml    (I/O breadth via io:<id>)
#
# Tests prove scenarios with `scenario:<id>` markers in Go/Swift/Kotlin/JS tests
# or script tests. `go run ./cmd/scenariocheck -strict` fails when any
# unblocked, assessable scenario lacks a marker. A blocked scenario is a named,
# visible gap; remove `blocked:` when the journey lands.

schemaVersion: 1

