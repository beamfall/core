# Beamfall feature-coverage registry
#
# The backbone of the "every feature on every device, every release" guarantee.
# Every product
# feature is listed once, tagged with the targets it applies to. Tests declare
# the feature id(s) they prove via a `feature:<id>` marker the ledger tool
# scans (Go: a `// feature:<id>` comment in the test; Swift/Kotlin/JS: a tag in
# the test name or a marker comment). The coverage gate fails if any
# (feature x applicable target) cell lacks a green proof — exactly as
# TestEveryRouteRegistered fails if any route escapes the reveal registry.
#
# This registry is the canonical scope list for "every feature". It is also the
# matrix the self-hosted device list (strategy doc §9.2) is decided against:
# the device list only has to cover the targets named here.
#
# ── targets ───────────────────────────────────────────────────────────────
#   server       the Go core (proven in-process: L0/L1 conformance + L2 unit)
#   web          embedded Viewer/Manage/Admin (internal/web/app)
#   tvos         Apple TV — Viewer
#   androidtv    Android TV — Viewer
#   iphone       iOS — Viewer
#   ipad         iPadOS — Viewer + Manager + Console
#   androidmobile Android phone/tablet — Viewer
#   macos        macOS — Manager + Console (native premium)
#   windows      Windows — Viewer + Manager + standalone Core supervisor
#
# ── field semantics ─────────────────────────────────────────────────────────
#   applies   targets that must render/exercise the feature. Include `server`
#             when the server owns enforcement/logic proven by core tests.
#   status    implementation state (NOT test state): planned | partial | shipped.
#             First-pass estimate from the 2026-06-13 survey; the coverage
#             ledger — not this field — is the source of truth for "is it tested".
#   adr       the governing ADR(s).
#
# Convenience groups used in comments only (lists below are always explicit):
#   viewers       = tvos, androidtv, iphone, ipad, androidmobile, web
#   apple-mobile  = iphone, ipad
#   managers      = web, ipad, macos   (Manage + Console areas)

schemaVersion: 1

