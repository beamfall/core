services:
  core:
    build: .
    command: ["serve"]
    ports:
      - "8090:8090"
    env_file:
      - .env.example
    environment:
      BEAMFALL_ADDR: ":8090"
      BEAMFALL_DATA_DIR: /data
    volumes:
      - ./.beamfall-dev:/data
    # Only the port differs from the image, so the timing comes from the
    # Dockerfile HEALTHCHECK.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
